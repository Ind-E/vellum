name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      PACKAGE: vellum-${{ github.ref_name }}-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Verify version
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "vellum") | .version')
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig-dev libwayland-dev libxkbcommon-dev
      - name: Build
        run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Package
        run: |
          mkdir -p "$PACKAGE/share/man/man1" "$PACKAGE/share/shell-completions"
          cp README.md LICENSE default-config.toml "target/${{ matrix.target }}/release/vellum" "$PACKAGE"

          mapfile -d '' output_dirs < <(find "target/${{ matrix.target }}/release/build" -type d -path '*/vellum-*/out' \
            -exec test -f '{}/completions/vellum.bash' ';' -print0)
          if [ "${#output_dirs[@]}" -ne 1 ]; then
            echo "Expected one Vellum documentation directory, found ${#output_dirs[@]}" >&2
            exit 1
          fi
          output_dir=${output_dirs[0]}
          cp "$output_dir/man"/*.1 "$PACKAGE/share/man/man1"
          cp "$output_dir/completions"/* "$PACKAGE/share/shell-completions"

          tar -czf "$PACKAGE.tar.gz" "$PACKAGE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PACKAGE }}
          path: ${{ env.PACKAGE }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --draft --generate-notes --verify-tag
